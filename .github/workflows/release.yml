name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "steam_tracker/**"
      - "requirements.txt"
      - "build_exe.bat"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sam-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    name: Windows build + GitHub Release
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read SAM version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "steam_tracker/__init__.py" -Raw
          if ($content -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not find __version__ in steam_tracker/__init__.py"
          }
          $version = $matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building SAM v$version"

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install build dependencies
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows app
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name SAM --collect-all keyring --collect-all webview --add-data "steam_tracker\web;steam_tracker\web" app.py

      - name: Package build
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "SAM-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\SAM\*" -DestinationPath $zip -Force
          "asset=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$env:TAG"
          git push origin "$env:TAG"
          gh release create "$env:TAG" "$env:asset" --title "SAM v$env:VERSION" --generate-notes
