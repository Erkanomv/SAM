name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "steam_tracker/**"
      - "requirements.txt"
      - "SAM.spec"
      - "build_exe.bat"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sam-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Test, build, and release SAM
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read SAM version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "steam_tracker/__init__.py" -Raw
          if ($content -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not find __version__ in steam_tracker/__init__.py"
          }
          $version = $matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "asset=SAM-v$version-build.${{ github.run_number }}-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean SAM.spec

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\SAM\SAM.exe")) {
            throw "dist\SAM\SAM.exe was not produced."
          }

      - name: Package build
        shell: pwsh
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          Compress-Archive -Path "dist\SAM\*" -DestinationPath "$env:ASSET" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$env:TAG" "$env:ASSET" --target "${{ github.sha }}" --title "SAM v$env:VERSION build ${{ github.run_number }}" --generate-notes --latest
