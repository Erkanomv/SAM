name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "steam_tracker/**"
      - "requirements.txt"
      - "SAM.spec"
      - "build_exe.bat"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sam-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    name: Windows build + GitHub Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read SAM version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "steam_tracker/__init__.py" -Raw
          if ($content -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not find __version__ in steam_tracker/__init__.py"
          }
          $version = $matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building SAM v$version"

      - name: Check whether this version is already released
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:TAG"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists. Bump __version__ for the next release."
          } elseif ($response.StatusCode -eq 404) {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No existing release for $env:TAG. Continuing."
          } else {
            throw "GitHub release lookup failed with HTTP $($response.StatusCode)."
          }

      - name: Install build dependencies
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build Windows app
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean SAM.spec

      - name: Verify build
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "dist\SAM\SAM.exe")) {
            throw "dist\SAM\SAM.exe was not produced."
          }

      - name: Package Windows build
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "SAM-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\SAM\*" -DestinationPath $zip -Force
          "asset=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$env:TAG" "$env:asset" --target "$env:GITHUB_SHA" --title "SAM v$env:VERSION" --generate-notes
